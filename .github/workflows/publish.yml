name: Publish to PowerShell Gallery

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches the release tag
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest ./PSWriteMessage.psd1
          $tagVersion = [version]('${{ github.event.release.tag_name }}' -replace '^v')
          if ($manifest.Version -ne $tagVersion) {
              throw "Manifest version $($manifest.Version) does not match release tag $tagVersion."
          }
          Write-Host "Publishing PSWriteMessage $($manifest.Version)"

      - name: Stage module files
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Path staging/PSWriteMessage -Force
          Copy-Item -Path PSWriteMessage.psd1, PSWriteMessage.psm1, LICENSE, README.md, CHANGELOG.md -Destination $stage

      - name: Import smoke test
        shell: pwsh
        run: |
          Import-Module ./staging/PSWriteMessage/PSWriteMessage.psd1 -Force
          if (-not (Get-Command Write-Message -ErrorAction SilentlyContinue)) {
              throw "Write-Message was not exported by the staged module."
          }

      - name: Publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw "PSGALLERY_API_KEY secret is not set." }
          # NuGet provider missing is the most common Publish-Module CI failure.
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Publish-Module -Path ./staging/PSWriteMessage -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
